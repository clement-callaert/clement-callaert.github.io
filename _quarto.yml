project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "notes/*.qmd"
  resources:
    # Redirect stub for the note's old URL. Quarto does not copy stray .html
    # files unless they are declared as a resource.
    - "posts/probe-decoding-planning.html"

website:
  title: "Clément Callaert"
  site-url: "https://clement-callaert.github.io"
  description: "Research on generative and world models under finite compute."
  favicon: assets/mark-full.svg
  search: false
  open-graph: true
  twitter-card: true
  navbar:
    logo: assets/mark.svg
    logo-alt: "Clément Callaert"
    collapse-below: lg
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: writing.qmd
        text: Notes
      - href: cv.qmd
        text: CV
      - href: about.qmd
        text: About
  page-footer:
    left: "© 2026 Clément Callaert"
    right: "Built with [Quarto](https://quarto.org/)"

format:
  html:
    theme: theme.scss
    css: styles.css
    toc: false
    highlight-style: none
    anchor-sections: true
    link-external-icon: false
    link-external-newwindow: false

lang: en
